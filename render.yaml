# Bun ist Paketmanager; Render-Images haben Bun nicht vorinstalliert, deshalb
# wird es im buildCommand nachinstalliert. Die Server laufen unter Node
# (keytar/argon2 sind native Node-Addons).
services:
  - type: web
    name: merge-frontend
    env: static
    buildCommand: curl -fsSL https://bun.sh/install | bash && ~/.bun/bin/bun install --frozen-lockfile && ~/.bun/bin/bun run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: merge-ai-proxy
    env: node
    buildCommand: curl -fsSL https://bun.sh/install | bash && ~/.bun/bin/bun install --frozen-lockfile --production
    startCommand: node server/db/migrate.js && node server/ai-proxy.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://merge-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: merge-auth-db
          property: connectionString

databases:
  - name: merge-auth-db
    databaseName: merge_auth
    user: merge_user
    plan: free
    postgresMajorVersion: "16"
